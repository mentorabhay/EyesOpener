# Eyes Opener: Local PostgreSQL for development. Production uses Cloud SQL for PostgreSQL in Mumbai.
# Local PostgreSQL for development. Production uses Cloud SQL for PostgreSQL in Mumbai.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iopener
    ports:
      - "5432:5432"
    volumes:
      - iopener-db:/var/lib/postgresql/data
volumes:
  iopener-db:
